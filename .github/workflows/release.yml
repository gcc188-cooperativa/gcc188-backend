name: Release
on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Git Flow (Design §3.4): o PR de release integra em `master` e o PR de
      # retorno leva o aumento de volta para `develop`. Sem `target-branch`, a
      # action usaria o branch default (`develop`) e o merge não dispararia este
      # workflow — nenhuma tag, release ou imagem seria publicada.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  publicar-imagem:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar a imagem X.Y.Z
        run: ./gradlew bootBuildImage --publishImage
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          BP_OCI_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          BP_OCI_REVISION: ${{ github.sha }}
          BP_OCI_VERSION: ${{ github.event.release.tag_name }}
      - name: Retorno master para develop
        run: |
          gh pr create --base develop --head master \
            --title "chore: retorno da release ${{ github.event.release.tag_name }}" \
            --body "Leva o aumento de versão e o changelog de volta para develop." || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
