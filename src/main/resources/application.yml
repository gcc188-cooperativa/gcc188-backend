spring:
  application:
    name: gcc188-backend
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cooperativa}
    username: ${DB_USER:cooperativa}
    password: ${DB_PASSWORD:cooperativa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: America/Sao_Paulo
  auth:
    cookie-secure: true
    # jwt-secret: fornecido por segredo (app.auth.jwt-secret) — 256 bits ou mais
  # bootstrap:
  #   admin:
  #     email / password: criam o administrador inicial no primeiro boot
